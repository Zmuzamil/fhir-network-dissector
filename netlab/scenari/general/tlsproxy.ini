# HTTPS reverse proxy (Caddy) in front of HAPI, with a self-signed certificate.
# Not a fhir_node: labctl.py turns this file into a Caddy container. The front side is on the
# clinical network (captured, encrypted); the proxy talks to HAPI on the back network
# 10.63.1.0/24, which is NOT captured (like a capture point in front of a TLS terminator).
[node]
ip   = 10.63.0.30
mac  = 02:63:00:00:00:30

[proxy:tls]
upstream = 10.63.1.10:8080
