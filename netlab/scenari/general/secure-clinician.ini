# Clinician workstation that reaches the FHIR server through the HTTPS reverse proxy.
# Its traffic on the clinical network is encrypted (TLS): the dissector cannot read it, so
# the answer key marks these calls "encrypted" and the evaluation reports them separately.
[node]
ip   = 10.63.0.29
mac  = 02:63:00:00:00:29
seed = secure-clinician
server = https://10.63.0.30/fhir

[flow:ward-round]
kind       = clinician
interval   = 10
format     = json
gzip       = yes
connection = keep-alive
