[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-dissector"
version = "0.2.0"
description = "Detect and classify HL7 FHIR exchanges in network traffic (PCAP and live), with privacy-preserving JSON events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.5"]

[project.optional-dependencies]
lab = ["requests>=2.31"]

[project.scripts]
fhir-dissector = "fhir_dissector.cli:main"

[tool.setuptools]
packages = ["fhir_dissector"]
